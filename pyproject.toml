[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goodparts-test"
version = "0.1.0"
description = "Ozon product export, Telegram low-stock summary, and catalog-cleaning submission"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools]
packages = ["src"]
