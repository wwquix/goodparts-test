[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goodparts-test"
version = "0.1.0"
description = "Minimal Ozon Seller API diagnostics for the GoodParts test assignment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools]
packages = ["src"]
